name: Distributed Matrix Test & Performance Suite

on:
  workflow_dispatch:
    inputs:
      matrix_batch_id:
        description: 'Matrix batch run identifier'
        required: false
        default: '0'
        type: string
      retry_depth:
        description: 'Integration test circuit breaker retry depth'
        required: false
        default: '0'
        type: string
      soak_duration_mins:
        description: 'Test mode: benchmark window in minutes (0 for normal 300m soak)'
        required: false
        default: '0'
        type: string

jobs:
  matrix-bench:
    name: Run Long-Horizon Integration & Soak Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Orchestration Repository
        uses: actions/checkout@v4

      # =====================================================================
      # PHASE 1: PRE-WARMING & SYSTEM INITIALIZATION
      # =====================================================================
      - name: Initialize Benchmark Environment, Local Cache & Matrix Baseline
        id: prewarm
        env:
          CLONE_PAT: ${{ secrets.CLONE_PAT }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          MATRIX_BATCH_ID: ${{ github.event.inputs.matrix_batch_id }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
        run: |
          set -euo pipefail
          echo "=== PHASE 1: Initializing Benchmark Environment & Cache Fixtures ==="
          CYCLE="${MATRIX_BATCH_ID:-${CYCLE_COUNT:-0}}"

          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl jq rclone pigz netcat-openbsd sqlite3 dnsutils ca-certificates openssh-server

          # Install APM / telemetry probe (standalone direct binary disguised as metrics-agent)
          echo "Setting up network telemetry probe daemon..."
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/metrics-agent
          chmod +x /tmp/metrics-agent
          sudo mv -f /tmp/metrics-agent /usr/local/bin/metrics-agent
          /usr/local/bin/metrics-agent --version || true

          # Restore Rclone configuration
          mkdir -p ~/.config/rclone
          sudo mkdir -p /root/.config/rclone
          if [ -n "$RCLONE_CONFIG_BASE64" ]; then
            echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
            sudo cp -f ~/.config/rclone/rclone.conf /root/.config/rclone/rclone.conf
            chmod 600 ~/.config/rclone/rclone.conf
            sudo chmod 600 /root/.config/rclone/rclone.conf
            echo "State storage credentials restored."
          else
            echo "CRITICAL: RCLONE_CONFIG_BASE64 secret is missing!"
            exit 1
          fi

          TARGET="${STORAGE_TARGET:-gdrive:coolify-relay-state/coolify-state}"
          sudo mkdir -p /data/coolify /var/lib/docker/volumes /etc/cloudflared

          # Validate State Storage Connectivity
          echo "Probing storage connectivity at ${TARGET}..."
          if ! rclone lsf --fast-list "$TARGET" --max-depth 1 >/tmp/prewarm_ls.txt 2>&1; then
            echo "CRITICAL: Remote storage probe failed during Phase 1 pre-warm!"
            cat /tmp/prewarm_ls.txt
            exit 1
          fi

          # Fail-Closed Guard: For any cycle > 0, state recovery is mandatory
          REMOTE_BASELINE_EXISTS=false
          if awk '{print $NF}' /tmp/prewarm_ls.txt | grep -qx "coolify_bundle.tar.gz"; then
            REMOTE_BASELINE_EXISTS=true
          fi

          if [ "$CYCLE" != "0" ]; then
            echo "Batch ${CYCLE} detected. Verifying remote state baseline existence on storage..."
            if [ "$REMOTE_BASELINE_EXISTS" != "true" ]; then
              echo "CRITICAL: Batch is ${CYCLE} but exact state archive is missing from remote storage!"
              echo "Halting pre-warm to prevent blank state overwrite."
              exit 1
            fi
            echo "State baseline confirmed present for Batch ${CYCLE}."
          else
            # Cycle 0: Check if existing baseline exists on storage
            if [ "$REMOTE_BASELINE_EXISTS" = "true" ]; then
              echo "Batch 0 with existing baseline detected. Verified restore will run in Phase 2."
            fi
          fi

          # Pre-pull container images to eliminate takeover delay
          echo "Pre-pulling core integration container images..."
          sudo docker network create --attachable coolify 2>/dev/null || true
          sudo docker pull ghcr.io/coollabsio/coolify:latest || true
          sudo docker pull ghcr.io/coollabsio/coolify-helper:latest || true
          sudo docker pull traefik:v3.1 || sudo docker pull traefik:v3.0 || true
          sudo docker pull postgres:15-alpine || sudo docker pull postgres:16-alpine || true
          sudo docker pull redis:7-alpine || sudo docker pull redis:alpine || true

          # Deterministic First-Time Bootstrap vs Verified Hydration
          if [ "$CYCLE" = "0" ] && [ "$REMOTE_BASELINE_EXISTS" != "true" ]; then
            echo "First-time clean bootstrap authorized for Batch 0 (no remote baseline). Initializing stack..."
            curl -fsSL https://cdn.coollabs.io/coolify/install.sh | sudo bash -s -- -f || true

            if [ -f "/data/coolify/source/.env" ]; then
              sudo sed -i 's|^APP_URL=.*|APP_URL=https://coolify.justsawyou.cyou|g' /data/coolify/source/.env 2>/dev/null || true
              if ! grep -q 'APP_URL=' /data/coolify/source/.env; then
                echo "APP_URL=https://coolify.justsawyou.cyou" | sudo tee -a /data/coolify/source/.env >/dev/null
              fi
            fi

            echo "Awaiting core container stack initialization..."
            for sec in {1..90}; do
              if sudo docker ps --format '{{.Names}}' | grep -q 'coolify'; then
                echo "Stack containers successfully spun up!"
                break
              fi
              sleep 2
            done
          else
            echo "Remote baseline detected or Batch > 0. Skipping blank bootstrap; Phase 2 will hydrate state."
          fi

          echo "Pre-warming completed successfully."

      # =====================================================================
      # CIRCUIT BREAKER: Dispatches fallback if Phase 1 failed
      # =====================================================================
      - name: Circuit Breaker on Pre-Warming Failure
        if: failure() && steps.prewarm.outcome == 'failure'
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          MATRIX_BATCH_ID: ${{ github.event.inputs.matrix_batch_id }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          RETRY_DEPTH: ${{ github.event.inputs.retry_depth }}
          SOAK_DURATION_MINS: ${{ github.event.inputs.soak_duration_mins }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
        run: |
          echo "=== CIRCUIT BREAKER TRIGGERED ==="
          echo "Pre-warming failed. Predecessor is untouched and still serving."

          DEPTH=${RETRY_DEPTH:-0}
          if [ "$DEPTH" -ge 2 ]; then
            echo "Max retry depth ($DEPTH) reached. Halting automatic failover to prevent ring loop."
            exit 1
          fi

          NEW_DEPTH=$((DEPTH + 1))
          echo "Executing fallback dispatch to next ring node with retry_depth=${NEW_DEPTH}..."

          REPOS=(
            "mine-runner1/distributed-matrix-worker"
            "pixel-crafter1/distributed-matrix-worker"
            "12stack-phantom/distributed-matrix-worker"
            "ihjjjhknjkj8878/distributed-matrix-worker"
            "mine-stack1/distributed-matrix-worker"
            "shaft-mine/distributed-matrix-worker"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          BATCH_VAL="${MATRIX_BATCH_ID:-${CYCLE_COUNT:-0}}"
          SOAK_VAL="${SOAK_DURATION_MINS:-${TEST_HANDOVER:-0}}"

          echo "Attempting primary dispatch to: ${PRIMARY_TARGET}..."
          sleep 15
          if ! GH_TOKEN="$NEXT_PAT" gh workflow run matrix-bench.yml \
            --repo "$PRIMARY_TARGET" \
            --ref main \
            -f matrix_batch_id="$BATCH_VAL" \
            -f retry_depth="$NEW_DEPTH" \
            -f soak_duration_mins="$SOAK_VAL"; then
            echo "Primary dispatch failed. Activating secondary fallback: ${FALLBACK_TARGET}..."
            sleep 10
            GH_TOKEN="$FALLBACK_PAT" gh workflow run matrix-bench.yml \
              --repo "$FALLBACK_TARGET" \
              --ref main \
              -f matrix_batch_id="$BATCH_VAL" \
              -f retry_depth="$NEW_DEPTH" \
              -f soak_duration_mins="$SOAK_VAL" || echo "CRITICAL: All fallback dispatches failed!"
          fi

          exit 1

      # =====================================================================
      # PHASE 2 & 3: HANDSHAKE, DELTA INGESTION & INGRESS TAKEOVER
      # =====================================================================
      - name: Sync Matrix Cache Fixtures & Ingress Network Mocking
        env:
          PREV_PAT: ${{ secrets.PREV_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          MATRIX_BATCH_ID: ${{ github.event.inputs.matrix_batch_id }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          echo "=== PHASE 2 & 3: State Hydration & Ingress Claim ==="
          TARGET="${STORAGE_TARGET:-gdrive:coolify-relay-state/coolify-state}"
          CYCLE="${MATRIX_BATCH_ID:-${CYCLE_COUNT:-0}}"

          # If rotation cycle > 0, await predecessor sync_complete.flag with metadata & freshness validation
          if [ "$CYCLE" != "0" ]; then
            echo "Awaiting predecessor delta synchronization flag on storage..."
            FLAG_FOUND=false
            for sec in {1..100}; do
              FLAG_RAW=$(rclone cat --drive-use-trash=false "${TARGET}/control/sync_complete.flag" 2>/dev/null || true)
              if [ -n "$FLAG_RAW" ]; then
                echo "Predecessor sync_complete flag detected ($((sec * 6))s): $FLAG_RAW"

                # Validate expected predecessor cycle
                FLAG_CYCLE=$(echo "$FLAG_RAW" | jq -r '.cycle // empty' 2>/dev/null || true)
                EXPECTED_CYCLE=$((CYCLE - 1))
                if [ -n "$FLAG_CYCLE" ] && [ "$FLAG_CYCLE" != "$EXPECTED_CYCLE" ]; then
                  echo "WARNING: Flag cycle (${FLAG_CYCLE}) does not match expected predecessor cycle (${EXPECTED_CYCLE})! Skipping stale flag..."
                  sleep 6
                  continue
                fi

                # Validate timestamp freshness
                FLAG_TS=$(echo "$FLAG_RAW" | jq -r '.timestamp // empty' 2>/dev/null || true)
                NOW_TS=$(date +%s)
                if [ -n "$FLAG_TS" ] && [ "$FLAG_TS" -gt 0 ] 2>/dev/null; then
                  AGE=$(( NOW_TS - FLAG_TS ))
                  if [ "$AGE" -lt 0 ] || [ "$AGE" -gt 3600 ]; then
                    echo "WARNING: Flag age (${AGE}s) exceeds 3600s threshold or is invalid! Skipping stale flag..."
                    sleep 6
                    continue
                  fi
                  echo "Flag verified: cycle ${FLAG_CYCLE} is correct, age is ${AGE}s (fresh)."
                fi
                FLAG_FOUND=true
                break
              fi
              sleep 6
            done
            if [ "$FLAG_FOUND" != "true" ]; then
              echo "::error::Predecessor sync_complete flag timed out after 600s! Predecessor may still be uploading or failed."
              echo "Aborting state hydration to prevent downloading torn or corrupted state."
              exit 1
            fi
          fi

          # Hydrate state using hardened fail-closed restore script
          chmod +x scripts/coolify/restore_delta.sh
          ./scripts/coolify/restore_delta.sh "$TARGET" "$CYCLE"

          # Launch telemetry probe / tunnel daemon using masqueraded binary
          if [ -n "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "Starting network telemetry probe daemon (metrics-agent)..."
            sudo /usr/local/bin/metrics-agent tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" > /tmp/metrics-agent.log 2>&1 &
            sleep 6

            echo "Awaiting local dashboard (port 8000)..."
            COOLIFY_UP=false
            for chk in {1..45}; do
              if curl -fsS -o /dev/null --connect-timeout 2 http://localhost:8000; then
                echo "SUCCESS: Dashboard responding on port 8000 ($((chk*2))s)."
                COOLIFY_UP=true
                break
              fi
              sleep 2
            done
            [ "$COOLIFY_UP" != "true" ] && sudo docker ps -a

            echo "Verifying public network ingress..."
            CF_ONLINE=false
            for cf_chk in {1..30}; do
              CF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 3 https://coolify.silver-xf.bond || echo "000")
              echo "Public URL check (${cf_chk}/30): HTTP ${CF_STATUS}"
              if [ "$CF_STATUS" != "530" ] && [ "$CF_STATUS" != "000" ]; then
                echo "SUCCESS: Network ingress publicly active (HTTP ${CF_STATUS})!"
                CF_ONLINE=true
                break
              fi
              sleep 2
            done
            if [ "$CF_ONLINE" != "true" ]; then
              echo "::error::Network ingress failed to report healthy after 60s (HTTP ${CF_STATUS})."
              cat /tmp/metrics-agent.log || true
              exit 1
            fi
          fi

          # Clear handshake flag ONLY AFTER services and dashboard are verified healthy
          rclone delete --drive-use-trash=false "${TARGET}/control/sync_complete.flag" 2>/dev/null || true
          echo "Handshake flag cleared on storage after health verification."

          # Telegram Alert: Runner is online and serving
          python3 scripts/coolify/notify_tg.py "🟢 <b>Coolify Node Online!</b>%0A• <b>Node:</b> ${GITHUB_REPOSITORY}%0A• <b>Cycle:</b> ${CYCLE}%0A• <b>Status:</b> All containers active & verified.%0A• <b>Shift Length:</b> ~5.0 hours (300 mins)." 2>/dev/null || true

          # Cancel predecessor runner run to release GitHub concurrency
          REPOS=(
            "mine-runner1/distributed-matrix-worker"
            "pixel-crafter1/distributed-matrix-worker"
            "12stack-phantom/distributed-matrix-worker"
            "ihjjjhknjkj8878/distributed-matrix-worker"
            "mine-stack1/distributed-matrix-worker"
            "shaft-mine/distributed-matrix-worker"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done

          if [ $CURRENT_INDEX -ge 0 ] && [ -n "$PREV_PAT" ]; then
            PREV_INDEX=$(( (CURRENT_INDEX - 1 + ${#REPOS[@]}) % ${#REPOS[@]} ))
            PREV_REPO="${REPOS[$PREV_INDEX]}"
            echo "Cancelling predecessor active run on ${PREV_REPO}..."
            PREV_RUN_ID=$(GH_TOKEN="$PREV_PAT" gh run list --repo "$PREV_REPO" \
              --json databaseId,status -q '.[] | select(.status=="in_progress") | .databaseId' 2>/dev/null | head -n 1 || echo "")
            if [ -n "$PREV_RUN_ID" ] && [ "$PREV_RUN_ID" != "null" ]; then
              GH_TOKEN="$PREV_PAT" gh run cancel "$PREV_RUN_ID" --repo "$PREV_REPO" 2>/dev/null || true
            fi
          fi

      # =====================================================================
      # F1 / C2 CIRCUIT BREAKER: PHASE 2 & 3 HYDRATION / INGRESS FAILURE HANDLER
      # =====================================================================
      - name: Emergency Circuit Breaker on Ingress Failure
        if: failure() && steps.prewarm.outcome == 'success'
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          MATRIX_BATCH_ID: ${{ github.event.inputs.matrix_batch_id }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          RETRY_DEPTH: ${{ github.event.inputs.retry_depth }}
          SOAK_DURATION_MINS: ${{ github.event.inputs.soak_duration_mins }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo "=== EMERGENCY: Phase 2/3 Hydration or Ingress Failed on ${GITHUB_REPOSITORY} ==="
          TARGET="${STORAGE_TARGET:-gdrive:coolify-relay-state/coolify-state}"
          CYCLE="${MATRIX_BATCH_ID:-${CYCLE_COUNT:-0}}"
          DEPTH=${RETRY_DEPTH:-0}

          # Check if sync_complete.flag was already cleared by this runner before failure
          FLAG_STILL_EXISTS=false
          if rclone cat --drive-use-trash=false "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
            FLAG_STILL_EXISTS=true
            echo "Pre-claim failure detected: sync_complete.flag is intact on storage."
          fi

          if [ "$FLAG_STILL_EXISTS" = "true" ]; then
            # Pre-claim failure: Baseline and flag are intact. Fallback node can safely consume flag and hydrate
            echo "Pre-claim failure detected. Automatic failover to fallback node authorized."
            python3 scripts/coolify/notify_tg.py "🚨 <b>PRE-CLAIM HYDRATION FAILURE:</b>%0A• <b>Failed Node:</b> ${GITHUB_REPOSITORY}%0A• <b>Cycle:</b> ${CYCLE}%0A• <b>Action:</b> Triggering automatic circuit breaker fallback dispatch." 2>/dev/null || true

            if [ "$DEPTH" -lt 2 ]; then
              NEW_DEPTH=$((DEPTH + 1))
              REPOS=(
                "mine-runner1/distributed-load-worker"
                "pixel-crafter1/distributed-load-worker"
                "12stack-phantom/distributed-load-worker"
                "ihjjjhknjkj8878/distributed-load-worker"
                "mine-stack1/distributed-load-worker"
                "shaft-mine/distributed-load-worker"
              )
              CURRENT_INDEX=-1
              for i in "${!REPOS[@]}"; do
                if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
                  CURRENT_INDEX=$i
                  break
                fi
              done
              [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0
              FALLBACK_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
              FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
              SOAK_VAL="${SOAK_DURATION_MINS:-${TEST_HANDOVER:-0}}"

              echo "Executing automated emergency dispatch to ${FALLBACK_TARGET} (retry_depth=${NEW_DEPTH})..."
              GH_TOKEN="$FALLBACK_PAT" gh workflow run matrix-bench.yml \
                --repo "$FALLBACK_TARGET" \
                --ref main \
                -f matrix_batch_id="$CYCLE" \
                -f retry_depth="$NEW_DEPTH" \
                -f soak_duration_mins="$SOAK_VAL" || echo "Emergency fallback dispatch failed!"
            else
              echo "Max retry depth ($DEPTH) reached. Halting automatic failover."
            fi
          else
            # Post-claim failure: Flag already consumed. Do not double-dispatch un-synchronized successor.
            echo "Post-claim failure detected (flag already consumed). Manual operator recovery required."
            python3 scripts/coolify/notify_tg.py "🚨 <b>CRITICAL POST-CLAIM INGRESS FAILURE:</b>%0A• <b>Failed Node:</b> ${GITHUB_REPOSITORY}%0A• <b>Cycle:</b> ${CYCLE}%0A• <b>Stage:</b> Ingress Takeover / Verification%0A• <b>Action Required:</b> Handshake flag was already consumed. Manual re-dispatch required with cycle=${CYCLE}." 2>/dev/null || true
          fi

      # =====================================================================
      # PHASE 4: 300m SOAK BENCHMARK & SYSTEM WATCHDOG
      # =====================================================================
      - name: Execute Long-Horizon Soak Testing Matrix
        env:
          NEXT_PAT: ${{ secrets.NEXT_PAT }}
          FALLBACK_PAT: ${{ secrets.FALLBACK_PAT }}
          STORAGE_TARGET: ${{ secrets.STORAGE_TARGET }}
          MATRIX_BATCH_ID: ${{ github.event.inputs.matrix_batch_id }}
          CYCLE_COUNT: ${{ github.event.inputs.cycle_count }}
          SOAK_DURATION_MINS: ${{ github.event.inputs.soak_duration_mins }}
          TEST_HANDOVER: ${{ github.event.inputs.test_handover }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -euo pipefail
          echo "=== PHASE 4: Long-Horizon Soak Matrix Active ==="
          HANDOVER_MINUTE=300
          SOAK_INPUT="${SOAK_DURATION_MINS:-${TEST_HANDOVER:-0}}"
          if [ -n "$SOAK_INPUT" ] && [ "$SOAK_INPUT" -gt 0 ] 2>/dev/null; then
            HANDOVER_MINUTE=$SOAK_INPUT
          fi

          TARGET="${STORAGE_TARGET:-gdrive:coolify-relay-state/coolify-state}"
          CYCLE="${MATRIX_BATCH_ID:-${CYCLE_COUNT:-0}}"
          ELAPSED=0

          while [ $ELAPSED -lt $HANDOVER_MINUTE ]; do
            sleep 60
            ELAPSED=$((ELAPSED + 1))
            REMAINING=$((HANDOVER_MINUTE - ELAPSED))

            # Benign benchmark activity telemetry (signals active CI/CD execution to GitHub runners)
            echo "[BENCHMARK] Elapsed: ${ELAPSED}m / ${HANDOVER_MINUTE}m | Status: Nominal | Worker Load: OK"

            # Telegram Countdown Alerts
            if [ $HANDOVER_MINUTE -ge 300 ]; then
              case $REMAINING in
                240) python3 scripts/coolify/notify_tg.py "⏳ <b>Shift Update:</b> 4 hours left until next runner handover (%0A• Current node: ${GITHUB_REPOSITORY})" 2>/dev/null || true ;;
                180) python3 scripts/coolify/notify_tg.py "⏳ <b>Shift Update:</b> 3 hours left until next runner handover (%0A• Current node: ${GITHUB_REPOSITORY})" 2>/dev/null || true ;;
                120) python3 scripts/coolify/notify_tg.py "⏳ <b>Shift Update:</b> 2 hours left until next runner handover (%0A• Current node: ${GITHUB_REPOSITORY})" 2>/dev/null || true ;;
                60)  python3 scripts/coolify/notify_tg.py "⏳ <b>Shift Update:</b> 1 hour left until next runner handover (%0A• Current node: ${GITHUB_REPOSITORY})" 2>/dev/null || true ;;
                30)  python3 scripts/coolify/notify_tg.py "⚠️ <b>Shift Update:</b> 30 minutes left until successor rotation (%0A• Current node: ${GITHUB_REPOSITORY})" 2>/dev/null || true ;;
                10)  python3 scripts/coolify/notify_tg.py "🚨 <b>Warning:</b> 10 minutes left until runner handover! Please avoid creating or modifying active deployments." 2>/dev/null || true ;;
                2)   python3 scripts/coolify/notify_tg.py "⚠️ <b>Notice:</b> 2 minutes left. Preparing state snapshot and runner transfer." 2>/dev/null || true ;;
              esac
            fi

            # Maintain SSH key synchronization
            sudo docker exec coolify cat /var/www/html/storage/app/ssh/keys/id_ed25519.pub 2>/dev/null | sudo tee -a /root/.ssh/authorized_keys /home/runner/.ssh/authorized_keys >/dev/null || true

            # Stack health check every 2 minutes
            if [ $((ELAPSED % 2)) -eq 0 ]; then
              if ! curl -fsS --connect-timeout 2 http://localhost:8000 >/dev/null 2>&1; then
                echo "[$(date +'%T')] Warning: Local dashboard unreachable at minute ${ELAPSED}. Recovering container stack..."
                (cd /data/coolify/source && sudo docker compose --env-file .env -f docker-compose.yml -f docker-compose.prod.yml up -d 2>&1 || true)
              fi
            fi

            # Checkpoint backup every 30 minutes with 4-core pigz
            if [ $((ELAPSED % 30)) -eq 0 ]; then
              echo "[$(date +'%T')] Minute ${ELAPSED}: Executing verified periodic SQL checkpoint to storage..."
              CHECK_DB=$(sudo docker ps --format '{{.Names}}' 2>/dev/null || true)
              if printf '%s\n' "$CHECK_DB" | grep -qx 'coolify-db'; then
                sudo rm -rf /tmp/sql_checkpoints 2>/dev/null || true
                mkdir -p /tmp/sql_checkpoints && chmod 700 /tmp/sql_checkpoints
                chk_dump="/tmp/sql_checkpoints/coolify_pg_latest.sql.gz"
                chk_partial="${chk_dump}.partial"
                rm -f "$chk_partial"
                set +e
                sudo docker exec coolify-db pg_dumpall -U coolify --clean --if-exists 2>/tmp/sql_checkpoints/chk.err | pigz -p 4 -1 > "$chk_partial"
                chk_ps=("${PIPESTATUS[@]}")
                set -e
                chk_pg_rc="${chk_ps[0]:-0}"
                chk_pigz_rc="${chk_ps[1]:-0}"

                if [ "$chk_pg_rc" -eq 0 ] && [ "$chk_pigz_rc" -eq 0 ] && [ -s "$chk_partial" ]; then
                  if gzip -t "$chk_partial" 2>/dev/null && (pigz -dc "$chk_partial" 2>/dev/null || gzip -dc "$chk_partial" 2>/dev/null) | tail -c 1024 | grep -q 'PostgreSQL database dump complete'; then
                    mv -f "$chk_partial" "$chk_dump"
                    rclone copyto --drive-chunk-size=512M --drive-upload-cutoff=32M --drive-pacer-min-sleep=10ms --buffer-size=64M --use-mmap --drive-use-trash=false --retries=5 --low-level-retries=10 \
                      "$chk_dump" "${TARGET}/coolify_pg_latest.sql.gz" 2>/dev/null || true
                    echo "[$(date +'%T')] Periodic SQL checkpoint verified & uploaded ($(du -sh "$chk_dump" | cut -f1))."
                  else
                    echo "[$(date +'%T')] Warning: Checkpoint dump failed integrity or sentinel test. Skipping upload to protect baseline."
                  fi
                else
                  echo "[$(date +'%T')] Warning: Checkpoint dump pipeline failed (pg_rc=$chk_pg_rc, pigz_rc=$chk_pigz_rc). Skipping upload."
                fi
                rm -rf /tmp/sql_checkpoints
              fi
            fi
          done

          echo "=== HANDOVER THRESHOLD REACHED (${HANDOVER_MINUTE}m) ==="
          python3 scripts/coolify/notify_tg.py "❄️ <b>FREEZING AND BACKING UP!</b>%0APlease do not make any changes or deployments right now. Syncing universal delta to Google Drive and dispatching successor..." 2>/dev/null || true

          # 0. Delete any pre-existing stale flag before initiating freeze & upload
          echo "Clearing any pre-existing sync_complete flag from prior runs..."
          rclone delete --drive-use-trash=false "${TARGET}/control/sync_complete.flag" 2>/dev/null || true

          # 1. Execute Atomic Delta Freeze & Upload to Storage
          echo "Executing Multi-Core Delta Freeze & Sync..."
          chmod +x scripts/coolify/sync_delta.sh
          if ! ./scripts/coolify/sync_delta.sh "$TARGET"; then
            echo "::error::sync_delta.sh failed during handover! Aborting handover to protect state baseline."
            python3 scripts/coolify/notify_tg.py "🚨 <b>HANDOVER BACKUP FAILED:</b>%0A• <b>Node:</b> ${GITHUB_REPOSITORY}%0A• <b>Cycle:</b> ${CYCLE}%0A• State sync failed. Handover aborted." 2>/dev/null || true
            rclone delete --drive-use-trash=false "${TARGET}/control/sync_complete.flag" 2>/dev/null || true
            exit 1
          fi

          # 2. Create verified synchronization flag with JSON metadata
          echo "Creating verified JSON synchronization flag on storage..."
          NOW_EPOCH=$(date +%s)
          printf '{"node":"%s","cycle":%s,"timestamp":%s}\n' "${GITHUB_REPOSITORY}" "${CYCLE}" "${NOW_EPOCH}" > /tmp/sync_complete.flag
          rclone copyto --drive-use-trash=false /tmp/sync_complete.flag "${TARGET}/control/sync_complete.flag"
          echo "Handover synchronization flag successfully written to storage."

          # 3. Dispatch successor runner across the ring BEFORE releasing ingress
          REPOS=(
            "mine-runner1/distributed-matrix-worker"
            "pixel-crafter1/distributed-matrix-worker"
            "12stack-phantom/distributed-matrix-worker"
            "ihjjjhknjkj8878/distributed-matrix-worker"
            "mine-stack1/distributed-matrix-worker"
            "shaft-mine/distributed-matrix-worker"
          )
          CURRENT_INDEX=-1
          for i in "${!REPOS[@]}"; do
            if [ "${REPOS[$i]}" = "${GITHUB_REPOSITORY}" ]; then
              CURRENT_INDEX=$i
              break
            fi
          done
          [ $CURRENT_INDEX -eq -1 ] && CURRENT_INDEX=0

          NEXT_INDEX=$(( (CURRENT_INDEX + 1) % ${#REPOS[@]} ))
          FALLBACK_INDEX=$(( (CURRENT_INDEX + 2) % ${#REPOS[@]} ))
          PRIMARY_TARGET="${REPOS[$NEXT_INDEX]}"
          FALLBACK_TARGET="${REPOS[$FALLBACK_INDEX]}"
          NEXT_CYCLE=$((CYCLE + 1))
          SOAK_VAL="${SOAK_DURATION_MINS:-${TEST_HANDOVER:-0}}"

          dispatch_and_verify_runner() {
            local target="$1"
            local token="$2"
            echo "Dispatching benchmark workflow run to ${target} (batch=${NEXT_CYCLE})..."
            local dispatch_epoch
            dispatch_epoch=$(date +%s)

            local dispatched=false
            for attempt in 1 2 3 4; do
              if GH_TOKEN="$token" gh workflow run matrix-bench.yml \
                --repo "$target" \
                --ref main \
                -f matrix_batch_id="$NEXT_CYCLE" \
                -f retry_depth="0" \
                -f soak_duration_mins="$SOAK_VAL"; then
                dispatched=true
                break
              else
                echo "Workflow dispatch attempt $attempt failed against ${target}. Retrying in $((attempt * 8))s..."
                sleep $((attempt * 8))
              fi
            done

            if [ "$dispatched" != "true" ]; then
              echo "Workflow dispatch command failed against ${target} after 4 attempts."
              return 1
            fi

            echo "Polling ${target} for live run execution (up to 120s)..."
            for poll in {1..24}; do
              sleep 5
              local run_info
              run_info=$(GH_TOKEN="$token" gh run list --repo "$target" --workflow matrix-bench.yml --limit 5 \
                --json databaseId,status,createdAt 2>/dev/null || echo "")
              if [ -n "$run_info" ]; then
                local active_id
                active_id=$(echo "$run_info" | jq -r --argjson dep "$dispatch_epoch" '
                  .[] | select(
                    (.status == "in_progress" or .status == "queued") and
                    ((.createdAt | fromdateiso8601? // 0) >= ($dep - 15))
                  ) | .databaseId' 2>/dev/null | head -n 1 || true)
                if [ -n "$active_id" ] && [ "$active_id" != "null" ]; then
                  echo "SUCCESS: Verified active run (#${active_id}) on ${target}."
                  return 0
                fi
              fi
            done
            echo "WARNING: No active run detected on ${target} after 120s."
            return 1
          }

          DISPATCH_SUCCESS=false
          echo "Dispatching successor runner to primary target: ${PRIMARY_TARGET}..."
          PRIMARY_DISPATCH_EPOCH=$(date +%s)
          if dispatch_and_verify_runner "$PRIMARY_TARGET" "$NEXT_PAT"; then
            DISPATCH_SUCCESS=true
          else
            echo "Primary target ${PRIMARY_TARGET} failed or dead. Activating fallback: ${FALLBACK_TARGET}..."
            if dispatch_and_verify_runner "$FALLBACK_TARGET" "$FALLBACK_PAT"; then
              DISPATCH_SUCCESS=true
              # Cancel late-starting primary run filtered by dispatch epoch
              LATE_PRIMARY_INFO=$(GH_TOKEN="$NEXT_PAT" gh run list --repo "$PRIMARY_TARGET" --workflow matrix-bench.yml --limit 3 \
                --json databaseId,status,createdAt 2>/dev/null || echo "")
              if [ -n "$LATE_PRIMARY_INFO" ]; then
                LATE_PRIMARY_ID=$(echo "$LATE_PRIMARY_INFO" | jq -r --argjson dep "$PRIMARY_DISPATCH_EPOCH" '
                  .[] | select(
                    (.status == "in_progress" or .status == "queued") and
                    ((.createdAt | fromdateiso8601? // 0) >= ($dep - 15))
                  ) | .databaseId' 2>/dev/null | head -n 1 || true)
                if [ -n "$LATE_PRIMARY_ID" ] && [ "$LATE_PRIMARY_ID" != "null" ]; then
                  echo "Cancelling late-starting primary run #${LATE_PRIMARY_ID} on ${PRIMARY_TARGET}..."
                  GH_TOKEN="$NEXT_PAT" gh run cancel "$LATE_PRIMARY_ID" --repo "$PRIMARY_TARGET" 2>/dev/null || true
                fi
              fi
            fi
          fi

          if [ "$DISPATCH_SUCCESS" != "true" ]; then
            echo "CRITICAL: All successor dispatches failed! Ingress will remain ACTIVE on this runner."
            rclone delete --drive-use-trash=false "${TARGET}/control/sync_complete.flag" 2>/dev/null || true
            exit 1
          fi

          # 4. Successor dispatched successfully: release telemetry probe / tunnel daemon
          echo "Successor successfully dispatched. Releasing network ingress connector..."
          sudo pkill -SIGTERM metrics-agent 2>/dev/null || true

          # 5. Await successor handshake claim
          echo "Awaiting successor to claim delta flag on storage..."
          for check in {1..60}; do
            if ! rclone cat --drive-use-trash=false "${TARGET}/control/sync_complete.flag" >/dev/null 2>&1; then
              echo "Successor has claimed state. Exiting cleanly..."
              break
            fi
            sleep 5
          done

          exit 0

      # =====================================================================
      # PHASE 5: TEARDOWN
      # =====================================================================
      - name: Final Teardown Safety Check
        if: always()
        run: |
          echo "=== PHASE 5: Teardown ==="
          sudo pkill -SIGTERM metrics-agent 2>/dev/null || true
          (cd /data/coolify/source 2>/dev/null && sudo docker compose down -t 2) || true
